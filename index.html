<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios Grid</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <h1>Ejercicios Grid</h1>

    <!-- Ejercicio 1 -->
    <section>
        <h2>Ejercicio 1</h2>

        <div class="grid-3">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>
    </section>

    <!-- Ejercicio 2 -->
    <section>
        <h2>Ejercicio 2</h2>

        <div class="grid-2">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
        </div>
    </section>

    <!-- Ejercicio 3 -->
    <section>
        <h2>Ejercicio 3 - Galería</h2>

        <div class="gallery">
            <img src="https://picsum.photos/300?1" alt="">
            <img src="https://picsum.photos/300?2" alt="">
            <img src="https://picsum.photos/300?3" alt="">
            <img src="https://picsum.photos/300?4" alt="">
        </div>
    </section>

    <!-- Ejercicio 4 -->
    <section>
        <h2>Ejercicio 4 - Dashboard</h2>

        <div class="dashboard">
            <div class="card">Panel 1</div>
            <div class="card">Panel 2</div>
            <div class="card">Panel 3</div>
            <div class="card">Panel 4</div>
            <div class="card">Panel 5</div>
            <div class="card">Panel 6</div>
        </div>
    </section>

</body>
</html>
